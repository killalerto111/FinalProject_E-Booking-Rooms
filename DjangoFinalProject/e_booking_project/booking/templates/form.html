{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>จองห้อง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #2e2e2e; color: #fff; background-image: url("{% static 'images/bg2.png' %}");
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;
        color: white;}
        .navbar, footer { background-color: #8B0000; }
        .form-section { background-color: #1f1f1f; padding: 30px; border-radius: 10px; margin-top: 20px; }
        .form-control, .form-select, .form-check-input { background-color: #333; color: #fff; border: 1px solid #555; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'index' %}">หน้าแรก</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="{% url 'form' %}">จองห้อง</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'booking_list' %}">รายการจองห้อง</a></li>
            </ul>
            {% if user.is_authenticated %}
            <span class="navbar-text me-3">👋 {{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    <div class="text-center my-4">
        <h2><i class="bi bi-calendar-event"></i> จองห้อง</h2>
    </div>

    <div class="form-section">
        <form id="bookingForm">
            <div class="mb-3">
                <label class="form-label">ชื่อห้อง</label>
                <select class="form-select" id="room" required>
                    <option value="">-- เลือกห้องประชุม --</option>
                    <option value="Classroom">Classroom</option>
                    <option value="Theater">Theater</option>
                    <option value="Boardroom">Boardroom</option>
                    <option value="Cabaret">Cabaret</option>
                    <option value="Banquet">Banquet</option>
                    <option value="Clusters Room">Clusters Room</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">จำนวนผู้เข้าร่วม</label>
                <input type="number" class="form-control" id="attendees" required>
            </div>
            <div class="mb-3">
                <label class="form-label">ชื่อผู้จอง</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">โทรศัพท์</label>
                <input type="text" class="form-control" id="phone" required>
            </div>
            <div class="row">
                <div class="col">
                    <label class="form-label">วันที่เริ่มต้น</label>
                    <input type="date" class="form-control" id="startDate" required>
                </div>
                <div class="col">
                    <label class="form-label">เวลาเริ่มต้น</label>
                    <input type="time" class="form-control" id="startTime" required>
                </div>
            </div><br>
            <div class="row">
                <div class="col">
                    <label class="form-label">วันที่สิ้นสุด</label>
                    <input type="date" class="form-control" id="endDate" required>
                </div>
                <div class="col">
                    <label class="form-label">เวลาสิ้นสุด</label>
                    <input type="time" class="form-control" id="endTime" required>
                </div>
            </div><br>
            <div class="mb-3">
                <label class="form-label">ใช้สำหรับ</label>
                <input type="text" class="form-control" id="purpose" required>
            </div>
            <div class="mb-3">
                <label class="form-label">อุปกรณ์</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="equipment1" value="เครื่องคอมพิวเตอร์">
                    <label class="form-check-label" for="equipment1">เครื่องคอมพิวเตอร์</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="equipment2" value="โปรเจ็กเตอร์">
                    <label class="form-check-label" for="equipment2">โปรเจ็กเตอร์</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="equipment3" value="เครื่องฉายแผ่นใส">
                    <label class="form-check-label" for="equipment3">เครื่องฉายแผ่นใส</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="checkbox" id="equipment4" value="ของว่าง">
                    <label class="form-check-label" for="equipment4">ของว่าง</label>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">อื่นๆ</label>
                <textarea class="form-control" id="other" rows="2"></textarea>
            </div>
            <button type="submit" class="btn btn-success">บันทึกการจอง</button>
        </form>
    </div>
</div><br>

<br>
<footer class="text-center text-light">
    <strong>This website is created for educational use. |</strong> NoEpic SPUStudent<br>
    67099190 | 67149706 | 67143059
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const equipments = [];
    ['equipment1', 'equipment2', 'equipment3', 'equipment4'].forEach(id => {
        if (document.getElementById(id).checked) {
            equipments.push(document.getElementById(id).value);
        }
    });
    const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
    bookings.push({
        room: document.getElementById('room').value,
        attendees: document.getElementById('attendees').value,
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        startDate: document.getElementById('startDate').value,
        startTime: document.getElementById('startTime').value,
        endDate: document.getElementById('endDate').value,
        endTime: document.getElementById('endTime').value,
        purpose: document.getElementById('purpose').value,
        equipments: equipments.join(', '),
        other: document.getElementById('other').value
    });
    localStorage.setItem('bookings', JSON.stringify(bookings));
    alert('บันทึกข้อมูลสำเร็จ!');
    window.location.href = '{% url 'booking_list' %}';
});
</script>
</body>
</html>
